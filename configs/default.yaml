data:
  train_path: data/raw/drugsComTrain_raw.tsv
  test_path: data/raw/drugsComTest_raw.tsv
  text_column: review
  label_column: condition
  conditions:
    - Birth Control
    - Depression
    - High Blood Pressure
    - Diabetes, Type 2

experiment:
  seed: 42
  test_size: 0.2
  train_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
  max_features: 100000
  ngram_range: [1, 2]
  min_df: 2
  output_dir: artifacts/runs
