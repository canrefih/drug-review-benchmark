[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-review-benchmark"
version = "0.1.0"
description = "Reproducible NLP benchmarks for drug-review condition classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33"]
dashboard = ["streamlit>=1.33"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
deep-learning = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.28"]

[project.scripts]
drugbench = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
